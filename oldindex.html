<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบข้อมูลกลุ่มภาวะพึ่งพิง</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="login-card">
        <div class="logo">
            <span class="imglogo"><img src="images/ltc.png" alt="LTC"></span>&nbsp;
            <span class="imglogo"><img src="images/njh.png" alt="LTC"></span>&nbsp;
            <span class="imglogo"><img src="images/tyo.png" alt="LTC"></span>
        </div>
        <h1>ระบบข้อมูลกลุ่มภาวะพึ่งพิง</h1>
        <p class="subtitle">เข้าสู่ระบบ</p>
        <form id="loginForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน</label>
                <div class="input-box">
                    <span>👤</span>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้งาน" required>
                </div>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <div class="input-box">
                    <span>🔒</span>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                    <span class="show-password" onclick="togglePassword()" id="eye">👁</span>
                </div>
            </div>
            <!-- Login -->
            <button type="submit" class="login-btn">
                เข้าสู่ระบบ
            </button>
        </form>

        <div id="message">
            เข้าสู่ระบบสำเร็จ
        </div>

        <div class="divider">
            หรือ
        </div>

    </div>


    <script>

        /* Show / Hide Password */
        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.getElementById("eye");

            if (password.type === "password") {

                password.type = "text";
                eye.textContent = "🙈";

            } else {

                password.type = "password";
                eye.textContent = "👁";

            }

        }
    </script>

</body>

</html>
