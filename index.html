<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ระบบข้อมูลกลุ่มภาวะพึ่งพิง</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Login Wrapper -->
    <main class="login-container">

        <!-- Login Card -->
        <section class="login-card">

            <!-- Header -->
            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>ระบบข้อมูลกลุ่มภาวะพึ่งพิง</h1>

                <p>
                    กรุณากรอก Username และ Password
                </p>

            </div>


            <!-- Login Form -->
            <form class="login-form" action="process_login.php" method="POST" autocomplete="on">

                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            👤
                        </span>

                        <input type="text" id="username" name="username" placeholder="กรอก Username"
                            autocomplete="username" required>

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🔑
                        </span>

                        <input type="password" id="password" name="password" placeholder="กรอก Password"
                            autocomplete="current-password" required>

                    </div>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-button">

                    เข้าสู่ระบบ

                </button>

            </form>


            <!-- Card Footer -->
            <div class="login-footer">

                <p>
                    ระบบบริหารจัดการสารสนเทศ
                </p>

            </div>

        </section>

    </main>

</body>

</html>
